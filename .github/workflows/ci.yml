name: CI

on:
  push:
    branches:
      - main
      - 'feishu-*'
  pull_request:

jobs:
  check:
    name: Test, build, and verify package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  windows-workspaces:
    name: Workspace regression tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check workspace creation, switching, and session recovery
        run: >-
          node --test test/default-workspace.test.mjs
          test/channels/shared/default-workspace-production.test.mjs
          test/workspace.test.mjs test/session-bind-store.test.mjs
          test/conversation-workspace-commands.test.mjs
          test/conversation-workspace-races.test.mjs
          test/conversation-workspace-switch-order.test.mjs
          test/conversation-workspace-bind-recovery.test.mjs
