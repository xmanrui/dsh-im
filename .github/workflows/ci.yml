name: CI

on:
  push:
    branches:
      - main
      - 'feishu-*'
  pull_request:

jobs:
  check:
    name: Test, build, and verify package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before any build: these tests read the bundles committed in the tree,
      # so they fail when a merged change edited plugin-src/ or src/ without
      # rebuilding lib/. npm run check builds first, which hides exactly that.
      - name: Committed bundles must match their source
        run: >-
          node --test test/client-i18n-bundle.test.mjs
          test/host-language-bundle.test.mjs
          test/package-client-inject.test.mjs

      - name: Run checks
        run: npm run check

      # lib/index.js rebuilds byte-identically across machines (the 5.10.0 artifact
      # reproduces exactly), so a host-side source edit that skipped the rebuild is
      # caught here. lib/client.js is not reproducible across build environments,
      # which the language-bundle test above covers by content instead.
      - name: Committed host bundle must match a fresh build
        run: git diff --exit-code -- lib/index.js

  windows-workspaces:
    name: Workspace and QR regression tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check workspace recovery and QR encoding diagnostics
        run: >-
          node --test test/default-workspace.test.mjs
          test/channels/shared/default-workspace-production.test.mjs
          test/workspace.test.mjs test/session-bind-store.test.mjs
          test/conversation-workspace-commands.test.mjs
          test/conversation-workspace-races.test.mjs
          test/conversation-workspace-switch-order.test.mjs
          test/conversation-workspace-bind-recovery.test.mjs
          test/preset-workspaces.test.mjs
          test/channels/shared/qr-encoding.test.mjs
